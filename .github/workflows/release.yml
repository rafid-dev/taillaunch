name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: '' }
          - { goos: linux, goarch: arm64, ext: '' }
          - { goos: darwin, goarch: amd64, ext: '' }
          - { goos: darwin, goarch: arm64, ext: '' }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          go build -trimpath -ldflags="-s -w -X main.version=${version}" -o "dist/taillaunch-${version}-${GOOS}-${GOARCH}${{ matrix.ext }}" ./cmd/taillaunch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: taillaunch-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  gui-build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, ext: '', cgo: '0' }
          - { runner: ubuntu-latest, goos: linux, goarch: arm64, ext: '', cgo: '0' }
          - { runner: windows-latest, goos: windows, goarch: amd64, ext: .exe, cgo: '0' }
          - { runner: windows-latest, goos: windows, goarch: arm64, ext: .exe, cgo: '0' }
          - { runner: macos-15-intel, goos: darwin, goarch: amd64, ext: '', cgo: '1' }
          - { runner: macos-14, goos: darwin, goarch: arm64, ext: '', cgo: '1' }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build GUI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        shell: bash
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          ldflags="-s -w -X main.version=${version}"
          if [ "${GOOS}" = "windows" ]; then ldflags="${ldflags} -H=windowsgui"; fi
          go build -trimpath -ldflags="${ldflags}" -o "dist/taillaunch-gui-${version}-${GOOS}-${GOARCH}${{ matrix.ext }}" ./cmd/taillaunch-gui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: taillaunch-gui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: [build, gui-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          generate_release_notes: true
          files: dist/*
